# This workflow installs dependencies, builds the source, and runs the test suite on Node.js 24.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: ships_n_cargo_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ships_n_cargo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ships_n_cargo_test

    defaults:
      run:
        working-directory: 'modules/ships-n-cargo'

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: modules/ships-n-cargo/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Set up PostgreSQL
        run: npm run db:setup
        env:
          SHIPS_N_CARGO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ships_n_cargo_test
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          verbose: true
